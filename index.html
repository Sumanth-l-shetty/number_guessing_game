<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="A modern JavaScript Number Guessing Game with difficulty levels and attempt tracking">

    <title>Number Guessing Game</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="game-container">

        <section class="game-card">

            <div class="header">
                <div class="game-icon">🎯</div>

                <h1>Number Guessing Game</h1>

                <p>
                    Guess the secret number before you run out of attempts!
                </p>
            </div>


            <!-- Difficulty -->

            <div class="difficulty-section">

                <h3>Choose Difficulty</h3>

                <div class="difficulty-buttons">

                    <button class="difficulty active"
                            data-level="easy">
                        Easy
                        <span>1–50</span>
                    </button>

                    <button class="difficulty"
                            data-level="medium">
                        Medium
                        <span>1–100</span>
                    </button>

                    <button class="difficulty"
                            data-level="hard">
                        Hard
                        <span>1–500</span>
                    </button>

                </div>

            </div>


            <!-- Game Information -->

            <div class="stats">

                <div class="stat">
                    <span>Range</span>
                    <strong id="range">1 - 50</strong>
                </div>

                <div class="stat">
                    <span>Attempts</span>
                    <strong id="attempts">0</strong>
                </div>

                <div class="stat">
                    <span>Remaining</span>
                    <strong id="remaining">10</strong>
                </div>

            </div>


            <!-- Progress -->

            <div class="progress-container">

                <div class="progress-info">
                    <span>Attempts Used</span>
                    <span id="progressText">0 / 10</span>
                </div>

                <div class="progress-bar">
                    <div id="progress"></div>
                </div>

            </div>


            <!-- Message -->

            <div id="message" class="message">
                🎮 Make your first guess!
            </div>


            <!-- Input -->

            <div class="input-section">

                <input
                    type="number"
                    id="guessInput"
                    placeholder="Enter your guess"
                    autocomplete="off"
                >

                <button id="guessButton" class="guess-button">
                    Guess
                </button>

            </div>


            <!-- Restart -->

            <button id="restartButton" class="restart-button">
                🔄 New Game
            </button>


            <div class="footer">
                <p>Built with ❤️ using HTML, CSS & JavaScript</p>
            </div>

        </section>

    </main>


    <script src="script.js"></script>

</body>
</html>
